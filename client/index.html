<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EagleEyes</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background: #000;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        pointer-events: none;
        z-index: 10;
      }

      #scopeOverlay {
        display: none;
        pointer-events: none;
        z-index: 20;
      }

      /* Blurs everything outside the scope circle; inside stays sharp via the mask hole. */
      #scopeBlur {
        position: fixed;
        inset: 0;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        -webkit-mask-image: radial-gradient(
          circle at center,
          rgba(255, 255, 255, 0) 0,
          rgba(255, 255, 255, 0) 26vh,
          rgba(255, 255, 255, 1) 32vh
        );
        mask-image: radial-gradient(
          circle at center,
          rgba(255, 255, 255, 0) 0,
          rgba(255, 255, 255, 0) 26vh,
          rgba(255, 255, 255, 1) 32vh
        );
      }

      #scopeReticle {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 56vh;
        height: 56vh;
        margin: -28vh 0 0 -28vh;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.75);
      }

      #scopeReticle::before,
      #scopeReticle::after {
        content: "";
        position: absolute;
        background: rgba(0, 0, 0, 0.85);
      }

      #scopeReticle::before {
        top: 50%;
        left: 0;
        width: 100%;
        height: 2px;
        transform: translateY(-1px);
      }

      #scopeReticle::after {
        left: 50%;
        top: 0;
        height: 100%;
        width: 2px;
        transform: translateX(-1px);
      }

      #healthBar {
        position: fixed;
        left: 20px;
        bottom: 20px;
        width: 220px;
        height: 28px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        overflow: hidden;
        z-index: 15;
        font-family: sans-serif;
      }

      #healthBarFill {
        position: absolute;
        inset: 0;
        width: 100%;
        background: linear-gradient(90deg, #c0392b, #e74c3c);
        transition: width 0.15s ease-out;
      }

      #healthText {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #fff;
        font-size: 13px;
        font-weight: bold;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }

      #ammoCounter {
        position: fixed;
        right: 20px;
        bottom: 20px;
        padding: 6px 14px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        z-index: 15;
        font-family: sans-serif;
        font-size: 15px;
        font-weight: bold;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }

      #deathOverlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: sans-serif;
        background: rgba(10, 0, 0, 0.78);
        z-index: 30;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      #deathOverlay.visible {
        opacity: 1;
      }

      #deathTitle {
        font-size: 72px;
        font-weight: bold;
        letter-spacing: 6px;
        color: #c0392b;
        text-shadow: 0 0 24px rgba(192, 57, 43, 0.85);
      }

      #deathSubtitle {
        font-size: 20px;
        letter-spacing: 2px;
        color: #ddd;
      }

      #pvpZoneIndicator {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 16px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(220, 60, 60, 0.6);
        border-radius: 4px;
        z-index: 15;
        font-family: sans-serif;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 2px;
        color: #e74c3c;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        display: none;
      }

      #pvpZoneIndicator.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="crosshair"></div>
    <div id="scopeOverlay">
      <div id="scopeBlur"></div>
      <div id="scopeReticle"></div>
    </div>
    <div id="healthBar">
      <div id="healthBarFill"></div>
      <span id="healthText">100 / 100</span>
    </div>
    <div id="ammoCounter">5 / 5</div>
    <div id="pvpZoneIndicator">PVP ZONE &mdash; CREATURES CAN'T REACH YOU HERE</div>
    <div id="deathOverlay">
      <div id="deathTitle">YOU DIED</div>
      <div id="deathSubtitle">Respawning in 3s</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
